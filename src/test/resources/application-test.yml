spring:
  datasource:
    url: jdbc:h2:mem:weshape;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

weshape:
  auth:
    mode: dev
  cors:
    allowed-origins: http://localhost:*
