name: Build wind map data

# Downloads the whole-world Global Wind Atlas layers (250 m), turns each into a
# compact cloud-optimised GeoTIFF and uploads it to the Cloudflare R2 bucket the
# backend reads from. Run from the Actions tab with "Run workflow".
# Takes one to three hours; the five layers run side by side.
#
# Needs these repository secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_BUCKET.

on:
  workflow_dispatch:
    inputs:
      layers:
        description: "Layers to build (comma separated): ws10, ws50, ws100, ws200, pd100"
        default: "ws10,ws50,ws100,ws200,pd100"

permissions:
  contents: read

concurrency:
  group: gwa-wind-build
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.list.outputs.layers }}
    steps:
      - id: list
        run: echo "layers=$(echo '${{ inputs.layers }}' | tr -d ' ' | jq -Rc 'split(",") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  layer:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJson(needs.plan.outputs.layers) }}
    steps:
      - uses: actions/checkout@v4

      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin python3-gdal python3-numpy > /dev/null
          gdalinfo --version

      - name: Find the source file
        id: source
        run: |
          case "${{ matrix.layer }}" in
            ws10)  path=wind-speed/10 ;;
            ws50)  path=wind-speed/50 ;;
            ws100) path=wind-speed/100 ;;
            ws200) path=wind-speed/200 ;;
            pd100) path=power-density/100 ;;
            *) echo "Unknown layer ${{ matrix.layer }}"; exit 1 ;;
          esac
          # aria2 follows the atlas' redirect to where the file is stored.
          url="https://globalwindatlas.info/api/gis/global/$path"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          stored=$(curl -sSL -r 0-0 -o /dev/null -w '%{url_effective}' "$url")
          echo "Stored at: ${stored%%\?*}"

      - name: Download the source file
        # Reading in small ranges over the network is fast from Amazon, so the
        # whole file is taken first, over several connections at once.
        if: matrix.layer != 'pd100'
        run: |
          sudo apt-get install -y -qq aria2 > /dev/null
          mkdir -p src
          aria2c --quiet=false --summary-interval=60 --console-log-level=warn \
            -x 16 -s 16 -k 64M --max-tries=10 --retry-wait=10 --file-allocation=none \
            -d src -o source.tif "${{ steps.source.outputs.url }}"
          ls -l src/source.tif

      - name: Download the power density by country
        # The world file sits on DTU's own server, which sends one connection at
        # about 0.5 MB/s (8+ hours). The same data per country comes from the
        # atlas' fast CDN, so take every country and lay them together.
        if: matrix.layer == 'pd100'
        run: |
          mkdir -p src/countries
          curl -sSL --retry 5 https://globalwindatlas.info/api/regions/countrySuggestions -o src/countries.json
          jq -r '.[].iso_a3 | select(. != null)' src/countries.json | sort -u > src/codes.txt
          echo "$(wc -l < src/codes.txt) countries"
          cat src/codes.txt | xargs -P 16 -I{} sh -c \
            'curl -sSL --retry 5 --retry-delay 5 --max-time 1800 -o src/countries/{}.tif "https://globalwindatlas.info/api/gis/country/{}/power-density/100" || echo "failed {}"'
          # Keep only real GeoTIFFs (a country without a file answers with an error page).
          for f in src/countries/*.tif; do gdalinfo "$f" > /dev/null 2>&1 || { echo "skipped $(basename $f)"; rm -f "$f"; }; done
          echo "$(ls src/countries | wc -l) country files, $(du -sh src/countries | cut -f1)"
          # One world mosaic on the same 250 m grid as the wind speed layers.
          gdalbuildvrt -te -180.00125 -64.00125 179.99875 79.99875 -tr 0.0025 0.0025 \
            -vrtnodata nan src/source.vrt src/countries/*.tif
          gdalinfo src/countries/ROU.tif | grep -i -E "nodata|pixel size|origin" || true
          gdalinfo src/source.vrt | head -20

      - name: Convert
        run: |
          mkdir -p out
          input=src/source.tif
          [ -f src/source.vrt ] && input=src/source.vrt
          python3 tool/gwa_build_wind.py "${{ matrix.layer }}" "$input" "out/${{ matrix.layer }}.tif"
          rm -rf src
        env:
          PYTHONUNBUFFERED: "1"
          SOURCE_URL: ${{ steps.source.outputs.url }}

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.s3.multipart_chunksize 64MB
          aws s3 cp "out/${{ matrix.layer }}.tif" "s3://$BUCKET/wind/gwa/${{ matrix.layer }}.tif" --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 cp "out/${{ matrix.layer }}.tif.json" "s3://$BUCKET/wind/gwa/${{ matrix.layer }}.json" --endpoint-url "$ENDPOINT" --only-show-errors
          {
            echo "### ${{ matrix.layer }}"
            echo '```json'
            jq 'del(.sourceMetadata, .source)' "out/${{ matrix.layer }}.tif.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
